name: build-site
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libs in case any R package source-compiles (e.g. fs -> libuv).
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      # Pin a binary-covered R version so packages install as binaries (fast, reliable).
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Set up Python so reticulate can find it. Required on Ubuntu 24.04
      # where system Python may not be on PATH by default.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache the heavy (~600MB) C++ backend for the R torch package
      - name: Cache R LibTorch
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.torch
          key: ${{ runner.os }}-libtorch-v1


      - name: Install R packages and render site
        env:
          # TORCH_INSTALL=1: Makes torch::install_torch() run non-interactively
          TORCH_INSTALL: 1
          # TORCH_HOME: Instructs R torch to install/find the C++ backend in the cached directory
          TORCH_HOME: ${{ github.workspace }}/.torch
        run: |
          mkdir -p ${{ github.workspace }}/.torch
          Rscript render.R

      # Pull Request: draft preview + comment the link.
      - name: Deploy preview + comment (PR)
        if: github.event_name == 'pull_request'
        uses: animint/animint-actions/netlify-deploy-comment@main
        with:
          netlify_auth_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify_site_id:    ${{ secrets.NETLIFY_SITE_ID }}
          pat_github_pr:      ${{ secrets.GITHUB_TOKEN }}
          path:               _site
          netlify_url:        mlr3torchaum-blog.netlify.app

      # Push to main: deploy to the production URL.
      - name: Deploy to production (main)
        if: github.event_name == 'push'
        run: npx --yes netlify-cli deploy --dir=_site --prod --site="${{ secrets.NETLIFY_SITE_ID }}" --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}"
